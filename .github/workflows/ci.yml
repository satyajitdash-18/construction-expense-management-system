name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: construction_expense
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/construction_expense
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin123
  MINIO_BUCKET: evidence
  MINIO_SECURE: "false"
  JWT_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
  APP_SECRET_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB==
  APP_ENV: testing

jobs:
  lint:
    name: Backend Lint, Compile & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -e .[dev]

      - name: Verify Python compilation
        run: |
          cd backend
          python -m compileall app alembic tests

      - name: Run ruff
        run: |
          cd backend
          ruff check .

      - name: Run mypy
        run: |
          cd backend
          mypy app --ignore-missing-imports

  test:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construction_expense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_expense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-09-22T00-33-43Z
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        command: server /data
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -e .[dev]

      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run test suite
        run: |
          cd backend
          pytest tests -v --tb=short

  frontend:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Unit & Integration Tests
        run: |
          cd frontend
          npm test

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build

  security:
    name: Dependency & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Python dependencies
        run: |
          pip install pip-audit
          cd backend
          pip install -e .
          pip-audit --desc on

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Production NPM dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

  containers:
    name: Container Build & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        env:
          MINIO_ACCESS_KEY: ci_minio_access_key
          MINIO_SECRET_KEY: ci_minio_secret_key_secure_2026
          JWT_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
        run: |
          docker compose -f infrastructure/docker-compose.yml config --quiet

      - name: Build MinIO Community Edition Image
        run: |
          docker build \
            --file infrastructure/docker/minio/Dockerfile \
            -t construction-minio:ci-test \
            infrastructure/docker/minio

      - name: Verify MinIO Community Edition Binary
        run: |
          docker run --rm construction-minio:ci-test minio --version
          docker run --rm construction-minio:ci-test mc --version

      - name: Build backend container
        run: docker build -t construction-backend:ci-test ./backend

      - name: Build frontend container
        run: docker build -t construction-frontend:ci-test ./frontend
[project]
name = "construction-expense-backend"
version = "0.1.0"
description = "AI-Assisted Construction Expense Management System - Backend"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlalchemy[asyncio]==2.0.*",
    "alembic==1.13.*",
    "asyncpg==0.29.*",
    "pydantic==2.9.*",
    "pydantic[email]==2.9.*",
    "pydantic-settings==2.5.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[argon2]==1.7.*",
    "python-multipart==0.0.*",
    "celery==5.4.*",
    "redis==5.0.*",
    "minio==7.2.*",
    "structlog==24.1.*",
    "sentry-sdk>=1.0.0,<2.0.0",
    "prometheus-fastapi-instrumentator==7.1.*",
    "httpx==0.27.*",
    "python-dotenv==1.0.*",
    "pytesseract==0.3.*",
    "pillow==10.4.*",
    "opencv-python-headless==4.10.*",
    "numpy==2.0.*",
    "google-generativeai==0.8.*",
    "anthropic==0.39.*",
    "aiofiles==24.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "pytest-cov==5.0.*",
    "ruff==0.6.*",
    "mypy==1.11.*",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]
per-file-ignores = { "tests/*" = ["S101", "S106"], "alembic/versions/*" = ["W291", "W292"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
    "pydantic.*",
    "fastapi.*",
    "celery.*",
    "redis.*",
    "minio.*",
    "structlog.*",
    "sentry_sdk.*",
    "prometheus_fastapi_instrumentator.*",
    "httpx.*",
    "passlib.*",
    "jose.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "integration: marks tests that require a live database or external services (skipped in unit-test CI)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]